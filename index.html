    <div class="actions"><button class="primary" id="next">Start Part 1</button></div></section>`));
  app.querySelector("#next").addEventListener("click", () => go(1));
}

function renderA(id) {
  const it = byId[id], ans = state.A[id] || (state.A[id] = {});
  const nAgent = it.turns.filter(t => t.role === "agent").length;
  const pos = state.group === null ? 0 : group().A.indexOf(id) + 1;
  const node = el(`<div class="grid2">
    <section class="card"><span class="eyebrow">Chat ${pos} of ${group().A.length}</span>
      <div class="transcript">${it.turns.map(t => t.role === "agent"
        ? `<div class="msg agent"><span class="who"><b>Agent #${t.n}</b></span>${md(t.text)}</div>`
        : `<div class="msg user"><span class="who">Customer</span>${md(t.text)}</div>`).join("")}</div></section>
    <section class="card sticky"><h2>Mark violations</h2>
      <p class="hint">Tap each agent message that goes against the preference, or “No violation”.</p>
      <div id="prefs" style="display:grid;gap:12px"></div>
      <div class="actions"><button class="ghost" id="back">Back</button><button class="primary" id="next">Next chat</button></div>
    </section></div>`);
  const prefs = node.querySelector("#prefs"), next = node.querySelector("#next");
  const complete = () => it.preferences.every(p => ans[p] && (ans[p] === "none" || ans[p].length));
  it.preferences.forEach((p, pi) => {
    const ex = EXAMPLES[(it.poles || [])[pi]];
    const box = el(`<div class="pref"><span class="name">${esc(prettyPref(p))}</span>` +
      (ex ? `<span class="hint">For example, this would go against it: ${esc(ex)}</span>` : "") + `<div class="chips"></div></div>`);
    const chips = box.querySelector(".chips");
    const none = el(`<button class="chip none" id="a-${id}-${pi}-none" aria-pressed="false">No violation</button>`);
    const sync = () => { none.setAttribute("aria-pressed", ans[p] === "none");
      chips.querySelectorAll("[data-n]").forEach(c => c.setAttribute("aria-pressed", Array.isArray(ans[p]) && ans[p].includes(+c.dataset.n)));
      next.disabled = !complete(); };
    none.addEventListener("click", () => { ans[p] = ans[p] === "none" ? undefined : "none"; sync(); });
    chips.append(none);
    for (let n = 1; n <= nAgent; n++) {
      const c = el(`<button class="chip" id="a-${id}-${pi}-${n}" data-n="${n}" aria-pressed="false">#${n}</button>`);
      c.addEventListener("click", () => { let cur = Array.isArray(ans[p]) ? ans[p] : [];
        cur = cur.includes(n) ? cur.filter(x => x !== n) : [...cur, n].sort((a, b) => a - b);
        ans[p] = cur.length ? cur : undefined; sync(); });
      chips.append(c);
    }
    prefs.append(box); sync();
  });
  node.querySelector("#back").addEventListener("click", () => go(-1));
  next.addEventListener("click", () => { if (complete()) go(1); });
  next.disabled = !complete();
  app.append(node);
}

function renderIntroB() {
  app.append(el(`<section class="card">
    <span class="eyebrow">Part 2 of 4 · 10 replies</span><h2>How is the customer reacting?</h2>
    <p>You will see one agent message and the customer's reply to it. Decide whether the reply shows the customer is
      <b>unhappy</b>, <b>pleased</b> or <b>neutral</b> about <b>how the agent communicated or behaved</b>: its tone,
      length, format, whether it asked first, gave options, explained itself, and so on.</p>
    <div class="grid2" style="align-items:start">
      <div><p><b>Signs of being unhappy</b> can be subtle. The reply might:</p>
        <ul class="plain">
          <li><b>ignore part of the message</b> and answer only the bit it needs;</li>
          <li><b>re-ask or rephrase</b> as if the answer didn't land;</li>
          <li><b>ask for something in a different form</b> (“so is it free or not?” after a long explanation);</li>
          <li><b>turn short, cold or flat</b>;</li>
          <li><b>say outright</b> what to change (“no need to explain all the rules”).</li>
        </ul></div>
      <div><p><b>Signs of being pleased</b>:</p>
        <ul class="plain">
          <li><b>warmer tone</b> or open thanks for <i>how</i> it was handled (“thank you, that means a lot”);</li>
          <li><b>engaging more readily</b>, moving smoothly and happily to the next thing.</li>
        </ul></div>
    </div>
    <p>Plain cooperation (“Sure, it's ABC123.”, “Yes, go ahead.”) with nothing extra is <b>neutral</b>, unless it feels noticeably
      colder or warmer than a normal reply. Feelings about the <b>situation</b> don't count: a refused refund, a full flight, a fee.</p>
    <p><b>Hint or outright?</b> When the customer is unhappy, a <b>question</b> or tone change is a hint. An <b>instruction or complaint</b> about
      how the agent communicates is outright, because it names what should change.</p>
    <ul class="plain">
      <li>“So is it free or not?” → <b>hint</b> (just a question)</li>
      <li>“You don't need to explain all the rules, just tell me the answer.” → <b>outright</b></li>
      <li>“Mm. Right.” → <b>hint</b> (cold, but says nothing about what to change)</li>
    </ul>
    <div class="example"><span class="eyebrow">Four examples</span>
      <div class="quote">Agent: Seat selection fees depend on your fare class, membership tier, route, and whether the seat is in an exit row or a preferred zone…
Customer: So is it free or not?</div>
      <p>Seems: <b>Unhappy</b> (re-asks for the plain answer). Outright: <b>No</b>. About: <b>Length</b>.</p>
      <div class="quote">Agent: Here's everything I did today: • changed the date • updated the seat • emailed the receipt
Customer: No need for the bullet list, just tell me in a sentence.</div>
      <p>Seems: <b>Unhappy</b>. Outright: <b>Yes</b>. About: <b>Formatting</b>.</p>
      <div class="quote">Agent: I'm so sorry about the missed connection, that sounds exhausting. Let's get you sorted out.
Customer: Thank you, that means a lot. My booking code is QX7Z2L.</div>
      <p>Seems: <b>Pleased</b> (warm thanks for how they were treated). About: <b>Empathy</b>.</p>
      <div class="quote">Agent: Your seat is 14C on the 7:40 departure.
Customer: Got it. Can I also check the meal options?</div>
      <p>Seems: <b>Neutral</b> (plain cooperation). No further questions.</p></div>
    ${guide(false)}
    <div class="actions"><button class="ghost" id="back">Back</button><button class="primary" id="next">Start Part 2</button></div></section>`));

function seg(name, options, cur, onPick) {
  const wrap = el(`<div class="seg" role="group"></div>`);
  for (const [v, label] of options) {
    const b = el(`<button class="chip none" id="${name}-${v}" aria-pressed="${cur === v}">${esc(label)}</button>`);
    b.addEventListener("click", () => { onPick(v); wrap.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    wrap.append(b);
  }
  return wrap;
}

function renderB(id) {
  const it = byId[id], ans = state.B[id] || (state.B[id] = {});
  const pos = group().B.indexOf(id) + 1;
  const node = el(`<section class="card"><span class="eyebrow">Reply ${pos} of ${group().B.length}</span>
    <div class="msg agent"><span class="who"><b>Agent</b></span>${md(it.agent)}</div>
    <div class="msg user"><span class="who">Customer</span>${md(it.user)}</div>
    <div class="q" id="q1"><label class="title">1. How does the customer seem about <i>how</i> the agent communicated or behaved?</label>
      <span class="hint">Unhappy: ignores part of it, re-asks, asks for a different form, goes short or cold, or says so. Pleased: warmer tone, thanks them for how it was handled, engages readily. Plain cooperation (“Sure, it's ABC123.”) is Neutral. Feelings about the situation itself don't count.</span></div>
    <div class="q" id="q2" hidden><label class="title">2. Does the customer say outright what the agent should do differently?</label>
      <span class="hint">Yes for an instruction or complaint about how the agent communicates (“no bullet points please”). A question like “so is it free or not?” or a change in tone is only a hint, so answer No.</span></div>
    <div class="q" id="q3" hidden><label class="title" for="dim-${id}">3. What is the reaction mainly about?</label></div>
    ${guide(false)}
    <div class="actions"><button class="ghost" id="back">Back</button><button class="primary" id="next">Next</button></div></section>`);
  const next = node.querySelector("#next");
  // One "how does the customer seem" question, stored in the original fields (unhappy / pleased /
  // explicit / dim) so saved answers, the Sheet and the analysis are unchanged. Neutral fills
  // explicit = no and dim = none; Pleased fills explicit = no (outright means a correction).
  const sel = el(`<select id="dim-${id}"><option value="">Choose…</option>
    <option value="none">No signal / can't tell</option>
    ${Object.entries(DIM_NAMES).map(([k, v]) => `<option value="${k}">${v} — ${DIM_DESC[k]}</option>`).join("")}
    <option value="task">The task itself — the outcome, a fee, a refusal (not how the agent communicated)</option></select>`);
  sel.value = ans.dim || ""; sel.addEventListener("change", () => { ans.dim = sel.value || undefined; upd(); });
  const seems = () => ans.unhappy === "yes" ? "unhappy" : ans.pleased === "yes" ? "pleased"
    : (ans.unhappy === "no" && ans.pleased === "no") ? "neutral" : undefined;
  const complete = () => ans.unhappy && ans.pleased && ans.explicit && ans.dim;
  const q2 = node.querySelector("#q2"), q3 = node.querySelector("#q3");
  const layout = () => { const v = seems();
    q2.hidden = v !== "unhappy"; q3.hidden = !v || v === "neutral";
  };
  const upd = () => { layout(); next.disabled = !complete(); };
  node.querySelector("#q1").append(seg("b1-" + id, [["unhappy", "Unhappy"], ["pleased", "Pleased"], ["neutral", "Neutral"]], seems(), v => {
    if (v !== seems()) { ans.explicit = undefined; ans.dim = undefined; sel.value = "";
      q2.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false")); }
    ans.unhappy = v === "unhappy" ? "yes" : "no"; ans.pleased = v === "pleased" ? "yes" : "no";
    if (v === "pleased") ans.explicit = "no";
    if (v === "neutral") { ans.explicit = "no"; ans.dim = "none"; }
    upd(); }));
  q2.append(seg("b2-" + id, [["yes", "Yes"], ["no", "No"]], ans.explicit, v => { ans.explicit = v; upd(); }));
  q3.append(sel);
  node.querySelector("#back").addEventListener("click", () => go(-1));
  next.addEventListener("click", () => { if (complete()) go(1); });
  upd(); app.append(node);
}

const STYLE_DESC = { terse: "short sentences and fragments", verbose: "long, explanatory messages",
  impolite: "blunt, no pleasantries", polite: "courteous, says please and thank you", impatient: "wants things done fast",
  patient: "happy to wait", agreeable: "goes along with suggestions", insistent: "pushes for what they asked",
  unsure: "hedges and seeks reassurance", confident: "states things with certainty", vague: "gives details only when asked",
  direct: "gives IDs and details upfront", casual: "relaxed, conversational", formal: "professional language",
  stoic: "shows little emotion", expressive: "shows emotions clearly" };

function renderIntroC() {
  app.append(el(`<section class="card">
    <span class="eyebrow">Part 3 of 4 · 8 notes</span><h2>Check the agent's notes about customers</h2>

      <li><b>Natural manner or reaction?</b> Is the note about how the customer <i>naturally</i> talks, whatever the
        agent does (“writes in short fragments”)? Or about how they <i>reacted</i> to something the agent did

      <li><b>After the reveal:</b> pick the item in the customer's real profile that the note captures, or say it gets one backwards, or matches none.</li>
    </ul>
    <div class="example"><span class="eyebrow">Example</span>
      <div class="quote">Note: The customer wants the agent to recommend one option rather than list several.
Evidence: Session 2: after a table of four flights, the customer asked “which is best?”</div>
      <p>Evidence backs it up: <b>Yes</b>. Natural manner or reaction: <b>A reaction to the agent</b> (they asked after
        being shown a table). If the real profile includes
        “gives a single best recommendation”, pick that. If it says “presents multiple options to choose from”, pick <b>Gets one of these backwards</b>.</p></div>
    <div class="actions"><button class="ghost" id="back">Back</button><button class="primary" id="next">Start Part 3</button></div></section>`));
  app.querySelector("#back").addEventListener("click", () => go(-1));
  app.querySelector("#next").addEventListener("click", () => go(1));
}

function renderC(id) {
  const it = byId[id], ans = state.C[id] || (state.C[id] = {});
  const pos = group().C.indexOf(id) + 1;
  const node = el(`<section class="card"><span class="eyebrow">Note ${pos} of ${group().C.length}</span>
    <div class="quote"><b>Note:</b> ${md(it.hypothesis)}</div>
    <div class="q"><span class="title">Evidence the agent cited</span>
      <ul class="plain">${it.evidence.map(e => `<li>${md(e)}</li>`).join("")}</ul></div>
    <div class="q" id="c1"><label class="title">1. Does the evidence back up the note?</label></div>
    <div class="q" id="c2"><label class="title">2. Is this about the customer's natural way of talking, or a reaction to something the agent did?</label></div>
    <div class="actions" id="revealRow"><button class="primary" id="reveal">Show the customer's real profile</button>
      <span class="hint" id="revealHint">Answer 1 and 2 first.</span></div>
    <div class="q" id="c3" hidden>
      <label class="title">3. Which part of the customer's real profile does this note capture?</label>
      <div class="pref" id="profile"></div>
    </div>
    <div class="actions"><button class="ghost" id="back">Back</button><button class="primary" id="next">Next</button></div></section>`);
  const next = node.querySelector("#next"), reveal = node.querySelector("#reveal"), c3 = node.querySelector("#c3");
  const blindDone = () => ans.support && ans.kind;
  const complete = () => blindDone() && ans.revealed && ans.match;
  const upd = () => { next.disabled = !complete(); reveal.disabled = !blindDone() || ans.revealed;
    node.querySelector("#revealHint").hidden = blindDone() || ans.revealed; };
  const c1 = seg("c1-" + id, [["yes", "Yes"], ["partly", "Partly"], ["no", "No"]], ans.support, v => { if (!ans.revealed) { ans.support = v; upd(); } });
  const c2 = seg("c2-" + id, [["style", "Their natural way of talking"], ["pref", "A reaction to the agent"],
    ["other", "Neither / too vague"]], ans.kind, v => { if (!ans.revealed) { ans.kind = v; upd(); } });
  node.querySelector("#c1").append(c1); node.querySelector("#c2").append(c2);
  const lockBlind = () => [c1, c2].forEach(w => w.querySelectorAll("button").forEach(b => b.disabled = true));
  const drawProfile = () => {
    c3.hidden = false; lockBlind();
    node.querySelector("#revealRow").hidden = true;
    const box = node.querySelector("#profile");
    const talks = it.profile.filter(p => p.kind === "style"), wants = it.profile.filter(p => p.kind === "pref");
    const row = (p, label) => `<button class="chip none" id="m-${id}-${p.value}" data-v="${p.value}" aria-pressed="${ans.match === p.value}">${esc(label)}</button>`;
    box.innerHTML =
      `<span class="eyebrow">How they talk</span><div class="chips">${talks.map(p => row(p, `${p.text}: ${STYLE_DESC[p.text] || ""}`)).join("") || '<span class="hint">No strong traits</span>'}</div>` +
      `<span class="eyebrow">What they want from the agent</span><div class="chips">${wants.map(p => row(p, p.text)).join("")}</div>` +
      `<span class="eyebrow">Or</span><div class="chips">${row({ value: "backwards" }, "Gets one of these backwards")}${row({ value: "none" }, "None of these")}</div>`;
    box.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => {
      ans.match = b.dataset.v; box.querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-pressed", x === b)); upd(); }));
  };
  reveal.addEventListener("click", () => { if (!blindDone()) return; ans.revealed = true; persist(); drawProfile(); upd(); });
  if (ans.revealed) drawProfile();
  node.querySelector("#back").addEventListener("click", () => go(-1));
  next.addEventListener("click", () => { if (complete()) go(1); });
  upd(); app.append(node);
}

function renderIntroD() {
  app.append(el(`<section class="card">
    <span class="eyebrow">Part 4 of 4 · 2 comparisons</span><h2>Which memory is better?</h2>
    <p>After five chats with the same customer, two versions of the agent kept different kinds of memory about them.
      You'll see both, labelled <b>Memory A</b> and <b>Memory B</b>. Read both, answer one question, then reveal the
      customer's real profile and answer one more.</p>
    <ul class="plain">
      <li><b>Before the reveal:</b> if you were the agent talking to this customer next, which memory would you rather rely on?</li>
      <li><b>After the reveal:</b> which memory gets more of the real profile right, with fewer wrong claims?</li>
    </ul>
    <p><b>How to judge accuracy.</b> Go through each memory's claims about the customer. A claim is <b>wrong</b> if it
      contradicts the real profile, or if it contradicts another claim in the same memory (for example “wants short
      answers” and “likes long, detailed explanations”). Prefer the memory with more right claims and fewer wrong ones.
      If one gets more right but also more wrong, or they're close, choose <b>About the same</b>.</p>
    <div class="example"><span class="eyebrow">Example</span>
      <p>Real profile: <i>wants short answers; wants one clear recommendation.</i></p>
      <div class="quote">Memory X: • Prefers brief replies. • Wants the agent to just pick the best option.
Memory Y: • Prefers brief replies. • Enjoys hearing every option in detail.</div>
      <p>X gets both right. Y gets one right, and its second claim contradicts both the profile and its own first claim.
        Answer: <b>X</b>.</p></div>
    <p class="muted">The two memories are written in different styles, and both can contain mistakes. Judge what they say, not how they look.</p>
    <div class="actions"><button class="ghost" id="back">Back</button><button class="primary" id="next">Start Part 4</button></div></section>`));
  app.querySelector("#back").addEventListener("click", () => go(-1));
  app.querySelector("#next").addEventListener("click", () => go(1));
}

function renderMemory(m) {
  if (m.type === "prose")
    return m.items.map(n => `<div class="memnote"><span class="eyebrow">After chat ${n.session}</span>${md(n.text)}</div>`).join("");
  return `<ul class="plain memlist">` + m.items.map(h => `<li><span class="tag">${esc(h.tier || "")}</span>
      <b>${esc(h.kind)}:</b> ${md(h.text)} <span class="hint">(seen in chat${h.sessions.length > 1 ? "s" : ""} ${h.sessions.join(", ")})</span>
      ${h.evidence.length ? `<details><summary class="hint">Evidence</summary><ul class="plain">${h.evidence.map(e => `<li class="hint">${md(e)}</li>`).join("")}</ul></details>` : ""}</li>`).join("") + `</ul>`;
}

function renderD(id) {
  const it = byId[id], ans = state.D[id] || (state.D[id] = {});
  const pos = group().D.indexOf(id) + 1;
  const node = el(`<div style="display:grid;gap:20px">
    <section class="card"><span class="eyebrow">Comparison ${pos} of ${group().D.length}</span>
      <div class="grid2 mem">
        <div class="memcol"><h2>Memory A</h2>${renderMemory(it.A)}</div>
        <div class="memcol"><h2>Memory B</h2>${renderMemory(it.B)}</div>
      </div></section>
    <section class="card">
      <div class="q" id="d1"><label class="title">1. If you were the agent talking to this customer next, which memory would you rather rely on?</label></div>
      <div class="actions" id="revealRow"><button class="primary" id="reveal">Show the customer's real profile</button>
        <span class="hint" id="revealHint">Answer 1 first.</span></div>
      <div class="q" id="d2" hidden><label class="title">2. Which memory gets more of the real profile right, with fewer wrong claims?</label>
        <div class="pref" id="profile"></div></div>
      <div class="actions"><button class="ghost" id="back">Back</button><button class="primary" id="next">Next</button></div>
    </section></div>`);
  const next = node.querySelector("#next"), reveal = node.querySelector("#reveal"), d2 = node.querySelector("#d2");
  const opts = [["A", "Memory A"], ["B", "Memory B"], ["same", "About the same"]];
  const complete = () => ans.rely && ans.revealed && ans.accurate;
  const upd = () => { next.disabled = !complete(); reveal.disabled = !ans.rely || ans.revealed;
    node.querySelector("#revealHint").hidden = !!ans.rely || ans.revealed; };
  const q1 = seg("d1-" + id, opts, ans.rely, v => { if (!ans.revealed) { ans.rely = v; upd(); } });
  node.querySelector("#d1").append(q1);
  const showProfile = () => {
    d2.hidden = false; node.querySelector("#revealRow").hidden = true;
    q1.querySelectorAll("button").forEach(b => b.disabled = true);
    const talks = it.profile.filter(p => p.kind === "style"), wants = it.profile.filter(p => p.kind === "pref");
    node.querySelector("#profile").innerHTML =
      `<span class="eyebrow">How they talk</span><p>${talks.map(p => `<b>${esc(p.text)}</b> (${esc(STYLE_DESC[p.text] || "")})`).join(", ") || "No strong traits"}</p>` +
      `<span class="eyebrow">What they want from the agent</span><ul class="plain">${wants.map(p => `<li>${esc(p.text)}</li>`).join("")}</ul>`;
    d2.append(seg("d2-" + id, opts, ans.accurate, v => { ans.accurate = v; upd(); }));
  };
  reveal.addEventListener("click", () => { if (!ans.rely) return; ans.revealed = true; persist(); showProfile(); upd(); });
  if (ans.revealed) showProfile();
  node.querySelector("#back").addEventListener("click", () => go(-1));
  next.addEventListener("click", () => { if (complete()) go(1); });
  upd(); app.append(node);
}

function renderDone() {
  if (!state.submitted) { state.submitted = true; state.finished = new Date().toISOString(); persist(); }
  const out = JSON.stringify({ name: state.name, first: state.first, surname: state.surname, participant: state.participant, group: state.group, started: state.started,
    finished: state.finished, A: state.A, B: state.B, C: state.C, D: state.D });
  const node = el(`<section class="card"><span class="eyebrow">Finished</span><h2 id="thanks"></h2>
    <p id="msg"></p>
    <textarea id="dump" readonly></textarea>
    <div class="actions"><button class="primary" id="copy">Copy answers</button><button class="ghost" id="back">Back to last note</button></div></section>`);
  node.querySelector("#thanks").textContent = "Thank you, " + (state.first || state.name);
  const msg = node.querySelector("#msg");
  const say = () => msg.textContent = (dbOk || sheetSent)
    ? "Your answers were sent, so you're done. As a backup you can also copy them below and send them to the organizer."
    : "Last step: press “Copy answers” and send the copied text to the organizer (email or chat is fine).";
  say(); writing.then(say);
  if (!sheetSent) sendToSheet(out).then(ok => { if (ok) { sheetSent = true; say(); } });
  const ta = node.querySelector("#dump"); ta.value = out;
  node.querySelector("#copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(out); node.querySelector("#copy").textContent = "Copied"; }
    catch (e) { ta.focus(); ta.select(); node.querySelector("#copy").textContent = "Press Ctrl/Cmd+C"; }
  });
  node.querySelector("#back").addEventListener("click", () => go(-1));
  app.append(node);
}

render();
</script>
